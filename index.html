<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>기출문제 보관함</title>
<style>
  :root{
    --navy:#1F2A44;
    --navy-light:#2E3C5E;
    --paper:#F7F5F1;
    --paper-dim:#EEEAE2;
    --ink:#2B2E36;
    --ink-dim:#6B7280;
    --amber:#C97A2E;
    --amber-dim:#E8C9A4;
    --line:#D8D3C6;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:480px;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 6px;
  }
  h1{
    font-size:24px;
    line-height:1.3;
    margin:0 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .sub{font-size:13px;color:var(--ink-dim);margin:0;}

  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:12px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:7px;
  }
  label .count{
    font-family:var(--mono);
    font-size:11px;
    font-weight:400;
    color:var(--ink-dim);
  }
  select{
    width:100%;
    padding:13px 14px;
    font-size:15px;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
  }
  select:disabled{color:var(--ink-dim);opacity:.6;}
  select:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}

  .result{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:20px;
    text-align:center;
  }
  .result.ready{border-style:solid;border-color:var(--navy);background:var(--navy);}
  .result p{margin:0 0 14px;font-size:13px;color:var(--ink-dim);}
  .result.ready p{color:var(--amber-dim);}

  .btn-row{display:flex;gap:8px;flex-wrap:nowrap;}
  .btn{
    flex:1;
    min-width:0;
    display:block;
    padding:13px 6px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    text-align:center;
    transition:transform .08s ease;
    white-space:normal;
    line-height:1.25;
  }
  .btn:active{transform:scale(.97);}
  .btn-problem{background:var(--amber);color:#fff;}
  .btn-solution{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn.disabled{background:var(--paper-dim);color:var(--ink-dim);pointer-events:none;}

  .qrow{display:flex;gap:8px;}
  .qrow select{
    width:auto;
    flex:0 0 76px;
    padding:13px 8px;
    font-size:14px;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
  }
  .qrow input{
    flex:1;
    min-width:0;
    padding:13px 14px;
    font-size:15px;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
  }
  .qrow input:disabled{opacity:.6;}
  .qrow input:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .qrow .btn{flex:1.3;min-width:130px;background:#cc0000;color:#fff;}
  .qrow .btn.disabled{background:var(--paper-dim);color:var(--ink-dim);}

  footer{
    margin-top:22px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    line-height:1.7;
  }
  footer b{color:var(--navy);}

  .cam-area{
    border:2px dashed var(--line);border-radius:12px;
    padding:16px;text-align:center;cursor:pointer;
    transition:border-color .15s;position:relative;
  }
  .cam-area:hover{border-color:var(--amber);}
  .cam-btn-row{display:flex;gap:10px;}
  .cam-btn{
    flex:1;position:relative;overflow:hidden;
    border:1.5px solid var(--line);border-radius:9px;
    background:var(--paper);padding:14px 8px;
    cursor:pointer;text-align:center;transition:border-color .15s;
  }
  .cam-btn:hover{border-color:var(--amber);}
  .cam-btn input[type=file]{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
  }
  .cam-btn-icon{font-size:24px;margin-bottom:4px;}
  .cam-btn-label{font-size:12px;color:var(--ink-dim);font-weight:600;}

  .scan-preview{
    width:100%;border-radius:10px;margin-bottom:12px;
    display:none;max-height:220px;object-fit:contain;
  }
  .scan-btn{
    width:100%;padding:13px;border-radius:9px;border:none;cursor:pointer;
    background:var(--amber);color:#fff;font-size:14px;font-weight:700;
  }
  .scan-btn:disabled{background:var(--paper-dim);color:var(--ink-dim);cursor:default;}
  .scan-status{
    margin-top:10px;font-size:12px;text-align:center;
    color:var(--ink-dim);min-height:18px;line-height:1.5;
  }
  .scan-status.err{color:#c0392b;}
  .scan-status.ok{color:#2d7a3a;font-weight:600;}

  /* 하이라이트 캔버스 */
  #hlCanvas{
    width:100%;border-radius:10px;margin-bottom:12px;
    display:none;cursor:pointer;
  }

  /* OCR 텍스트 박스 */
  .ocr-box{
    margin-top:10px;background:var(--paper);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font-size:11px;font-family:var(--mono);
    color:var(--ink-dim);line-height:1.7;white-space:pre-wrap;word-break:break-all;
    max-height:120px;overflow-y:auto;display:none;
  }
  .ocr-box.show{display:block;}
  .ocr-box-label{
    font-size:11px;font-weight:600;color:var(--navy);margin-top:10px;
    display:none;
  }
  .ocr-box-label.show{display:block;}

  .match-card{
    margin-top:12px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.7;
    text-align:left;display:none;
  }
  .match-card.show{display:block;}
  .match-card b{color:var(--navy);}
  .match-item{
    padding:8px 10px;margin-top:6px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;transition:background .1s;
  }
  .match-item:hover{background:var(--amber-dim);}
  .match-item .mi-label{font-weight:700;color:var(--navy);font-size:13px;}
  .match-item .mi-score{font-family:var(--mono);font-size:10px;color:var(--ink-dim);}
  .match-item .mi-preview{color:var(--ink-dim);font-size:11px;margin-top:2px;}
  .mi-pdf-btn{
    flex:1;display:inline-block;padding:6px 10px;border-radius:7px;
    font-size:12px;font-weight:600;text-decoration:none;text-align:center;
    background:var(--amber);color:#fff;
  }
  .mi-pdf-btn-sol{background:var(--navy);}

  /* 수동 키워드 검색 */
  .kw-row{display:flex;gap:8px;margin-top:6px;}
  .kw-row input{
    flex:1;min-width:0;
    padding:11px 14px;font-size:14px;font-family:var(--sans);
    color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:9px;
  }
  .kw-row input:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .kw-btn{
    padding:11px 16px;border-radius:9px;border:none;cursor:pointer;
    background:var(--navy);color:#fff;font-size:13px;font-weight:600;
    white-space:nowrap;
  }
  .kw-result{
    margin-top:10px;font-size:12px;color:var(--ink-dim);display:none;
  }
  .kw-result.show{display:block;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Personal Archive</p>
    <h1>기출문제 보관함</h1>
    <p class="sub">학년 · 연도 · 월을 고르면 저장된 문제·해설을 엽니다.</p>
  </header>

  <div class="panel">
    <div class="field">
      <label>학년 <span class="count" id="gradeCount"></span></label>
      <select id="grade">
        <option value="">선택하세요</option>
      </select>
    </div>
    <div class="field">
      <label>연도 <span class="count" id="yearCount"></span></label>
      <select id="year" disabled>
        <option value="">학년을 먼저 선택하세요</option>
      </select>
    </div>
    <div class="field">
      <label>월</label>
      <select id="month" disabled>
        <option value="">연도를 먼저 선택하세요</option>
      </select>
    </div>
  </div>

  <div class="result" id="result">
    <p id="resultMsg">학년 / 연도 / 월을 모두 선택하면 여기에서 열 수 있어요.</p>
    <div class="btn-row" id="btnRow"></div>
  </div>

  <div class="panel">
    <div class="field">
      <label>문제 번호 <span class="count">유튜브 해설 영상 검색</span></label>
      <div class="qrow">
        <select id="trackSel" style="display:none;">
          <option value="가형">가형</option>
          <option value="나형">나형</option>
        </select>
        <input type="number" id="qNum" min="1" placeholder="예: 28" disabled>
        <a class="btn disabled" id="btnYoutube" target="_blank" rel="noopener">영상 검색</a>
      </div>
    </div>
  </div>

  <!-- OCR + DB 매칭 패널 -->
  <div class="panel">
    <div class="field">
      <label>Gemini API 키 <span class="count" id="apiStatusLabel">미입력</span></label>
      <div class="api-row">
        <input type="password" id="apiKeyInput" placeholder="AIza...">
        <button class="api-save" id="apiSaveBtn" onclick="saveApiKey()">저장</button>
        <button class="api-save" style="background:#888;" onclick="deleteApiKey()">삭제</button>
      </div>
    </div>
    <div class="field">
      <label>문제 사진으로 자동 인식 <span class="count">Gemini OCR · DB 매칭</span></label>
      <canvas id="hlCanvas"></canvas>
      <img id="scanPreview" class="scan-preview" alt="미리보기">
      <div class="cam-area" id="camArea">
        <div class="cam-btn-row">
          <div class="cam-btn">
            <input type="file" accept="image/*" capture="environment" id="imgInputCam" onchange="onImageSelected(event)">
            <div class="cam-btn-icon">📷</div>
            <div class="cam-btn-label">카메라 촬영</div>
          </div>
          <div class="cam-btn">
            <input type="file" accept="image/*" id="imgInputGallery" onchange="onImageSelected(event)">
            <div class="cam-btn-icon">🖼️</div>
            <div class="cam-btn-label">갤러리 선택</div>
          </div>
        </div>
      </div>
      <button class="scan-btn" id="scanBtn" disabled onclick="runScan()">문제 인식하기</button>
      <div class="scan-status" id="scanStatus"></div>
      <div class="ocr-box-label" id="ocrLabel">📝 인식된 텍스트</div>
      <div class="ocr-box" id="ocrBox"></div>
      <div class="match-card" id="matchCard"></div>
    </div>

    <div class="field">
      <label>키워드로 직접 검색 <span class="count">DB 수동 검색</span></label>
      <div class="kw-row">
        <input type="text" id="kwInput" placeholder="예: 이차함수 실근 방정식">
        <button class="kw-btn" onclick="runKeywordSearch()">검색</button>
      </div>
      <div class="kw-result match-card" id="kwResult"></div>
    </div>
  </div>

  <footer>
    저장된 회차: <b id="totalCount">0</b>개 · 마지막 갱신 시 이 줄은 무시하셔도 됩니다<br>
    파일 추가 방법은 함께 받은 안내문을 참고하세요.
  </footer>

</div>

<script>
/* ============================================================
   폴더 구조: files / 학년 / 연도 / 월_문제.pdf, 월_해설.pdf
   예) files/고1/2024/03_문제.pdf
       files/고1/2024/03_해설.pdf

   [수능]
   월 대신 "수능"이라는 값을 쓰되, 홀수형/짝수형 구분 없이 통합 파일 하나로 사용합니다.
   예) files/고3/2024/수능_문제.pdf
       files/고3/2024/수능_해설.pdf
   DATA: { grade: "고3", year: 2024, month: "수능" }
   → 일반 월과 똑같이 "문제 PDF / 해설 PDF" 버튼 2개로 표시됩니다.

   [가형 / 나형 - 문이과 구분 시기]
   고2는 2016~2019년, 고3은 2016~2020년(수능 포함)이 가형/나형으로 나뉩니다.
   이 기간의 회차는 DATA에 track: "gana" 를 추가하면, 일반 모의고사든 수능이든
   상관없이 "가형 문제 / 나형 문제 / 가형 해설 / 나형 해설" 버튼 4개로 자동 표시됩니다.
   예) files/고3/2018/06_가형_문제.pdf
       files/고3/2018/06_나형_문제.pdf
       files/고3/2018/06_가형_해설.pdf
       files/고3/2018/06_나형_해설.pdf
       files/고3/2016/수능_가형_문제.pdf
       files/고3/2016/수능_나형_문제.pdf
       files/고3/2016/수능_가형_해설.pdf
       files/고3/2016/수능_나형_해설.pdf
   DATA: { grade: "고3", year: 2018, month: "06", track: "gana" }
        { grade: "고3", year: 2016, month: "수능", track: "gana" }
   (정확한 시행 월은 연도별로 다를 수 있으니 실제 자료 확인 후 채워주세요.)

   새 회차를 추가할 때는:
   1) files/학년/연도/ 폴더 안에 해당 파일들을 올리고
      (그 폴더가 없으면 업로드하면서 새로 생성됨)
   2) 아래 DATA 배열에 한 줄만 추가하면 끝 — 파일 경로는 자동 계산됩니다.
   (월은 두 자리, 예: 03, 06, 09, 11 / 수능은 "수능"이라고 적기)
   ============================================================ */
const DATA = [

  { grade: "고3", year: 2023, month: "03" },

function renderButtons(buttons){
  btnRow.innerHTML = '';

    a.target = '_blank';

function updateYoutubeLink(){
  const num = qNum.value.trim();
  if(!currentEntry || !num){
    btnYoutube.classList.add('disabled');
    btnYoutube.removeAttribute('href');
    return;
  }
  const { grade, year, month, track } = currentEntry;
  const monthPart = month === '수능' ? '수능' : `${parseInt(month)}월`;
  const typePart = track === 'gana' ? ` ${trackSel.value}` : '';
  const query = `${YT_CHANNEL} ${grade} ${year}년 ${monthPart}${typePart} ${num}번`;
  btnYoutube.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query);
  btnYoutube.classList.remove('disabled');
}

function fillSelect(sel, items, placeholder){
  sel.innerHTML = '';
  const opt0 = document.createElement('option');
  opt0.value = '';
  opt0.textContent = items.length ? placeholder : '데이터 없음';
  sel.appendChild(opt0);
  items.forEach(v=>{
    const o = document.createElement('option');
    o.value = v;
    o.textContent = typeof v === 'string' && v.match(/^\d{2}$/) ? `${v}월` : v;
    sel.appendChild(o);
  });
  sel.disabled = items.length === 0;
}

  const g = gradeSel.value;

  const months = [...new Set(DATA.filter(d=>d.grade===g && String(d.year)===String(y)).map(d=>d.month))].sort();
  fillSelect(monthSel, months, '월을 선택하세요');
});

monthSel.addEventListener('change', ()=>{
  const g = gradeSel.value, y = yearSel.value, m = monthSel.value;
  if(!m){ clearResult(); return; }
  const entry = DATA.find(d=>d.grade===g && String(d.year)===String(y) && d.month===m);

  const track = entry.track || null;
  const label = m === '수능' ? `${y}년 수능` : `${y}년 ${parseInt(m)}월`;

      { label: '가형 문제', href: pdfPath(g, y, m, '가형_문제'), primary: true },

      { label: '가형 해설', href: pdfPath(g, y, m, '가형_해설'), primary: false },
      { label: '나형 해설', href: pdfPath(g, y, m, '나형_해설'), primary: false },
    ]);
  } else {
    renderButtons([
      { label: '문제 PDF', href: pdfPath(g, y, m, '문제'), primary: true },
      { label: '해설 PDF', href: pdfPath(g, y, m, '해설'), primary: false },

});

/* ============================================================
   Gemini OCR + DB 매칭
   - Gemini Vision으로 텍스트 추출 (OCR 전용)
   - 추출된 텍스트를 로컬 db.json과 매칭
   - API 키는 localStorage에 저장 (GitHub에 올라가지 않음)
   ============================================================ */

  document.getElementById('ocrBox').classList.remove('show');

function similarity(a, b){
  const tok = s => new Set(
    s.replace(/[^가-힣a-zA-Z0-9]/g,' ').split(/\s+/).filter(w=>w.length>1)
  );
  const sa = tok(a), sb = tok(b);
  let inter = 0; sa.forEach(w=>{ if(sb.has(w)) inter++; });
  const union = new Set([...sa,...sb]).size;
  return union===0 ? 0 : inter/union;
}

function parseExamInfo(text){
  const yearM  = text.match(/(\d{4})/);
  const gradeM = text.match(/고\s*([123])/);
  const year   = yearM  ? parseInt(yearM[1])  : null;
  const grade  = gradeM ? `고${gradeM[1]}`    : null;
  let month = null;
  if(/수능/.test(text)) month = '수능';
  else { const m=text.match(/(\d{1,2})\s*월/); if(m) month=String(parseInt(m[1])).padStart(2,'0'); }
  const numM   = text.match(/(?:^|\D)(\d{1,2})\s*[.\s]/m);
  const number = numM ? parseInt(numM[1]) : null;
  return {grade, year, month, number};
}

function topMatches(queryText, n=3){
  if(!examDB) return [];
  const q = queryText.slice(0, 1000);
  let scores = [];
  for(const entry of examDB){
    for(const prob of (entry.problems||[])){
      const s = similarity(q, prob.text);
      if(s > 0.05) scores.push({entry, prob, score: s});
    }
  }
  return scores.sort((a,b)=>b.score-a.score).slice(0,n);
}

// Gemini로 이미지에서 텍스트만 추출
async function extractTextWithGemini(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async ev => {
      const b64 = ev.target.result.split(',')[1];
      const mime = file.type || 'image/jpeg';
      const prompt = `이 이미지에서 보이는 모든 텍스트를 그대로 추출해줘. 
수식, 숫자, 한글, 영어 모두 포함해서 이미지에 있는 텍스트를 빠짐없이 출력해줘.
설명이나 주석 없이 추출된 텍스트만 출력해줘.`;
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${geminiApiKey}`,
          {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              contents:[{parts:[
                {inline_data:{mime_type: mime, data: b64}},
                {text: prompt}
              ]}],
              generationConfig:{temperature:0, maxOutputTokens:1024}
            })
          }
        );
        const data = await res.json();
        if(data.error) { reject(new Error(data.error.message)); return; }
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        resolve(text);
      } catch(err){ reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

async function runScan(){
  if(!geminiApiKey){
    setStatus('먼저 Gemini API 키를 입력하고 저장해주세요.', 'err'); return;
  }
  if(!selectedImageFile){
    setStatus('사진을 먼저 선택해주세요.', 'err'); return;
  }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = '텍스트 추출 중...';
  hideOcrBox();
  document.getElementById('matchCard').classList.remove('show');
  setStatus('Gemini가 텍스트를 추출하고 있어요...');

  try {
    const text = await extractTextWithGemini(selectedImageFile);

    // 추출된 텍스트 표시
    showOcrBox(text);

    if(!text.trim()){
      setStatus('텍스트를 추출하지 못했어요. 더 선명한 사진으로 시도해보세요.', 'err');
      btn.disabled=false; btn.textContent='다시 인식'; return;
    }

    setStatus('DB와 매칭 중...');

    // 우선순위 1: 시험 정보 직접 파싱
    const info = parseExamInfo(text);
    const direct = info.grade && info.year && info.month
      ? DATA.find(d=>d.grade===info.grade && String(d.year)===String(info.year) && d.month===info.month)
      : null;

    if(direct){
      await applyMatch(direct, info.number,
        `✓ ${info.grade} ${info.year}년 ${info.month==='수능'?'수능':parseInt(info.month)+'월'} 직접 인식 완료!`);
      btn.disabled=false; btn.textContent='다시 인식'; return;
    }

    // 우선순위 2: DB 유사도 매칭
    if(!examDB){
      setStatus('db.json을 불러오지 못했어요.', 'err');
      btn.disabled=false; btn.textContent='다시 인식'; return;
    }

    const top = topMatches(text);
    if(top.length===0){
      setStatus('유사한 문제를 찾지 못했어요. 하단 키워드 검색을 이용해보세요.', 'err');
      btn.disabled=false; btn.textContent='다시 인식'; return;
    }

    showMatchCard(top, 'matchCard');
    setStatus(`유사한 문제 ${top.length}개를 찾았어요. 아래에서 선택해주세요.`, 'ok');
    btn.disabled=false; btn.textContent='다시 인식';

  } catch(err){
    setStatus('오류: ' + err.message, 'err');
    btn.disabled=false; btn.textContent='다시 인식';
  }
}

function showMatchCard(top, cardId){
  const card = document.getElementById(cardId);
  card.innerHTML = '<b>유사 문제 후보</b>';
  top.forEach(({entry, prob, score})=>{
    const ml = entry.month==='수능' ? '수능' : parseInt(entry.month)+'월';
    const track = entry.track || null;
    const pdfBtns = track==='gana'
      ? `<div style="display:flex;gap:6px;margin-top:6px;">
           <a href="${pdfPath(entry.grade,entry.year,entry.month,'가형_문제')}" target="_blank" rel="noopener" class="mi-pdf-btn" onclick="event.stopPropagation()">가형 문제</a>
           <a href="${pdfPath(entry.grade,entry.year,entry.month,'나형_문제')}" target="_blank" rel="noopener" class="mi-pdf-btn" onclick="event.stopPropagation()">나형 문제</a>
         </div>`
      : `<div style="display:flex;gap:6px;margin-top:6px;">
           <a href="${pdfPath(entry.grade,entry.year,entry.month,'문제')}" target="_blank" rel="noopener" class="mi-pdf-btn" onclick="event.stopPropagation()">문제 PDF</a>
           <a href="${pdfPath(entry.grade,entry.year,entry.month,'해설')}" target="_blank" rel="noopener" class="mi-pdf-btn mi-pdf-btn-sol" onclick="event.stopPropagation()">해설 PDF</a>
         </div>`;
    const div = document.createElement('div');
    div.className = 'match-item';
    div.innerHTML = `
      <div class="mi-label">${entry.grade} · ${entry.year}년 ${ml}${prob.number?' '+prob.number+'번':''}</div>
      <div class="mi-score">유사도 ${Math.round(score*100)}%</div>
      <div class="mi-preview">${prob.text.slice(0,80).replace(/\n/g,' ')}...</div>
      ${pdfBtns}
    `;
    div.onclick = ()=>applyMatch(entry, prob.number,
      `✓ ${entry.grade} ${entry.year}년 ${ml}${prob.number?' '+prob.number+'번':''} 선택됨`);
    card.appendChild(div);
  });
  card.classList.add('show');
}

async function applyMatch(entry, number, statusMsg){
  gradeSel.value = entry.grade;
  gradeSel.dispatchEvent(new Event('change'));
  await new Promise(r=>setTimeout(r,60));
  yearSel.value = String(entry.year);
  yearSel.dispatchEvent(new Event('change'));
  await new Promise(r=>setTimeout(r,60));
  monthSel.value = entry.month;
  monthSel.dispatchEvent(new Event('change'));
  if(number){ qNum.value=number; qNum.dispatchEvent(new Event('input')); }
  setStatus(statusMsg, 'ok');
  document.getElementById('matchCard').classList.remove('show');
}

function runKeywordSearch(){
  const kw = document.getElementById('kwInput').value.trim();
  const resultEl = document.getElementById('kwResult');
  if(!kw){ resultEl.innerHTML='키워드를 입력해주세요.'; resultEl.classList.add('show'); return; }
  if(!examDB){ resultEl.innerHTML='db.json을 불러오지 못했어요.'; resultEl.classList.add('show'); return; }
  const top = topMatches(kw, 5);
  if(top.length===0){
    resultEl.innerHTML='<div style="color:#c0392b;font-size:12px;">일치하는 문제를 찾지 못했어요. 다른 키워드를 시도해보세요.</div>';
    resultEl.classList.add('show'); return;
  }
  showMatchCard(top, 'kwResult');
}

document.getElementById('kwInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') runKeywordSearch();
});

}
