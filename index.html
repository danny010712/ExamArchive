<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>기출문제 보관함</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --navy:#1F2A44;
    --navy-light:#2E3C5E;
    --paper:#F7F5F1;
    --paper-dim:#EEEAE2;
    --ink:#2B2E36;
    --ink-dim:#6B7280;
    --amber:#C97A2E;
    --amber-dim:#E8C9A4;
    --line:#D8D3C6;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:480px;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 6px;
  }
  h1{
    font-size:24px;
    line-height:1.3;
    margin:0 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .sub{font-size:13px;color:var(--ink-dim);margin:0;}

  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:12px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:7px;
  }
  label .count{
    font-family:var(--mono);
    font-size:11px;
    font-weight:400;
    color:var(--ink-dim);
  }
  select{
    width:100%;
    padding:13px 14px;
    font-size:15px;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
  }
  select:disabled{color:var(--ink-dim);opacity:.6;}
  select:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}

  .result{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:20px;
    text-align:center;
  }
  .result.ready{border-style:solid;border-color:var(--navy);background:var(--navy);}
  .result p{margin:0 0 14px;font-size:13px;color:var(--ink-dim);}
  .result.ready p{color:var(--amber-dim);}

  .btn-row{display:flex;gap:8px;flex-wrap:nowrap;}
  .btn{
    flex:1;
    min-width:0;
    display:block;
    padding:13px 6px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    text-align:center;
    transition:transform .08s ease;
    white-space:normal;
    line-height:1.25;
  }
  .btn:active{transform:scale(.97);}
  .btn-problem{background:var(--amber);color:#fff;}
  .btn-solution{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn.disabled{background:var(--paper-dim);color:var(--ink-dim);pointer-events:none;}

  .qrow{display:flex;gap:8px;}
  .qrow select{
    width:auto;
    flex:0 0 76px;
    padding:13px 8px;
    font-size:14px;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
  }
  .qrow input{
    flex:1;
    min-width:0;
    padding:13px 14px;
    font-size:15px;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
  }
  .qrow input:disabled{opacity:.6;}
  .qrow input:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .qrow .btn{flex:1.3;min-width:130px;background:#cc0000;color:#fff;}
  .qrow .btn.disabled{background:var(--paper-dim);color:var(--ink-dim);}

  footer{
    margin-top:22px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    line-height:1.7;
  }
  footer b{color:var(--navy);}

  .cam-area{
    border:2px dashed var(--line);border-radius:12px;
    padding:22px 16px;text-align:center;cursor:pointer;
    transition:border-color .15s;position:relative;
  }
  .cam-area:hover{border-color:var(--amber);}
  .cam-area input[type=file]{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
  }
  .cam-icon{font-size:32px;margin-bottom:6px;}
  .cam-label{font-size:13px;color:var(--ink-dim);}

  .scan-preview{
    width:100%;border-radius:10px;margin-bottom:12px;
    display:none;max-height:220px;object-fit:contain;
  }
  .scan-btn{
    width:100%;padding:13px;border-radius:9px;border:none;cursor:pointer;
    background:var(--amber);color:#fff;font-size:14px;font-weight:700;
  }
  .scan-btn:disabled{background:var(--paper-dim);color:var(--ink-dim);cursor:default;}
  .scan-status{
    margin-top:10px;font-size:12px;text-align:center;
    color:var(--ink-dim);min-height:18px;line-height:1.5;
  }
  .scan-status.err{color:#c0392b;}
  .scan-status.ok{color:#2d7a3a;font-weight:600;}

  .match-card{
    margin-top:12px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.7;
    text-align:left;display:none;
  }
  .match-card.show{display:block;}
  .match-card b{color:var(--navy);}
  .match-item{
    padding:8px 10px;margin-top:6px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;transition:background .1s;
  }
  .match-item:hover{background:var(--amber-dim);}
  .match-item .mi-label{font-weight:700;color:var(--navy);font-size:13px;}
  .match-item .mi-score{font-family:var(--mono);font-size:10px;color:var(--ink-dim);}
  .match-item .mi-preview{color:var(--ink-dim);font-size:11px;margin-top:2px;}

<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Personal Archive</p>
    <h1>기출문제 보관함</h1>
    <p class="sub">학년 · 연도 · 월을 고르면 저장된 문제·해설을 엽니다.</p>
  </header>

  <div class="panel">
    <div class="field">
      <label>학년 <span class="count" id="gradeCount"></span></label>
      <select id="grade">
        <option value="">선택하세요</option>
      </select>
    </div>
    <div class="field">
      <label>연도 <span class="count" id="yearCount"></span></label>
      <select id="year" disabled>
        <option value="">학년을 먼저 선택하세요</option>
      </select>
    </div>
    <div class="field">
      <label>월</label>
      <select id="month" disabled>
        <option value="">연도를 먼저 선택하세요</option>
      </select>
    </div>
  </div>

  <div class="result" id="result">
    <p id="resultMsg">학년 / 연도 / 월을 모두 선택하면 여기에서 열 수 있어요.</p>
    <div class="btn-row" id="btnRow"></div>
  </div>

  <div class="panel">
    <div class="field">
      <label>문제 번호 <span class="count">유튜브 해설 영상 검색</span></label>
      <div class="qrow">
        <select id="trackSel" style="display:none;">
          <option value="가형">가형</option>
          <option value="나형">나형</option>
        </select>
        <input type="number" id="qNum" min="1" placeholder="예: 28" disabled>
        <a class="btn disabled" id="btnYoutube" target="_blank" rel="noopener">영상 검색</a>
      </div>
    </div>
  </div>

  <!-- OCR + DB 매칭 패널 -->
  <div class="panel">
    <div class="field">
      <label>문제 사진으로 자동 인식 <span class="count">OCR · DB 매칭</span></label>
      <img id="scanPreview" class="scan-preview" alt="미리보기">
      <div class="cam-area" id="camArea">
        <input type="file" accept="image/*" id="imgInput" onchange="onImageSelected(event)">
        <div class="cam-icon">📷</div>
        <div class="cam-label">탭하여 촬영 또는 갤러리에서 선택</div>
      </div>
      <button class="scan-btn" id="scanBtn" disabled onclick="runScan()">문제 인식하기</button>
      <div class="scan-status" id="scanStatus"></div>
      <div class="match-card" id="matchCard"></div>
    </div>
  </div>

  <footer>
    저장된 회차: <b id="totalCount">0</b>개 · 마지막 갱신 시 이 줄은 무시하셔도 됩니다<br>
    파일 추가 방법은 함께 받은 안내문을 참고하세요.
  </footer>

</div>

   예) files/고1/2024/03_문제.pdf
       files/고1/2024/03_해설.pdf

   [수능]
   월 대신 "수능"이라는 값을 쓰되, 홀수형/짝수형 구분 없이 통합 파일 하나로 사용합니다.
   예) files/고3/2024/수능_문제.pdf

   → 일반 월과 똑같이 "문제 PDF / 해설 PDF" 버튼 2개로 표시됩니다.

function pdfPath(grade, year, month, type){
  return `files/${grade}/${year}/${month}_${type}.pdf`;
}

const GRADES = ["고1", "고2", "고3"];
const YT_CHANNEL = "새로이종남T";

const gradeSel = document.getElementById('grade');
const yearSel  = document.getElementById('year');
const monthSel = document.getElementById('month');
const result   = document.getElementById('result');
const resultMsg= document.getElementById('resultMsg');
const btnRow   = document.getElementById('btnRow');
const qNum     = document.getElementById('qNum');
const btnYoutube = document.getElementById('btnYoutube');
const trackSel = document.getElementById('trackSel');

let currentEntry = null; // { grade, year, month }

function renderButtons(buttons){
  btnRow.innerHTML = '';
  buttons.forEach(b=>{
    const a = document.createElement('a');
    a.className = 'btn ' + (b.primary ? 'btn-problem' : 'btn-solution');
    a.target = '_blank';
    a.rel = 'noopener';
    a.href = b.href;
    a.textContent = b.label;
    btnRow.appendChild(a);
  });
}

function renderDisabledButtons(labels){
  btnRow.innerHTML = '';
  labels.forEach(label=>{
    const a = document.createElement('a');
    a.className = 'btn disabled';
    a.textContent = label;
    btnRow.appendChild(a);
  });
}

function updateYoutubeLink(){
  const num = qNum.value.trim();
  if(!currentEntry || !num){
    btnYoutube.classList.add('disabled');
    btnYoutube.removeAttribute('href');
    return;
  }
  const { grade, year, month, track } = currentEntry;
  const monthPart = month === '수능' ? '수능' : `${parseInt(month)}월`;
  const typePart = track === 'gana' ? ` ${trackSel.value}` : '';
  const query = `${YT_CHANNEL} ${grade} ${year}년 ${monthPart}${typePart} ${num}번`;
  btnYoutube.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query);
  btnYoutube.classList.remove('disabled');
}

qNum.addEventListener('input', updateYoutubeLink);
trackSel.addEventListener('change', updateYoutubeLink);

function resetYoutubeField(){
  currentEntry = null;
  qNum.value = '';
  qNum.disabled = true;
  trackSel.style.display = 'none';
  trackSel.value = '가형';
  btnYoutube.classList.add('disabled');
  btnYoutube.removeAttribute('href');
}

function fillSelect(sel, items, placeholder){
  sel.innerHTML = '';
  const opt0 = document.createElement('option');
  opt0.value = '';
  opt0.textContent = items.length ? placeholder : '데이터 없음';
  sel.appendChild(opt0);
  items.forEach(v=>{
    const o = document.createElement('option');
    o.value = v;
    o.textContent = typeof v === 'string' && v.match(/^\d{2}$/) ? `${v}월` : v;
    sel.appendChild(o);
  });
  sel.disabled = items.length === 0;
}

function init(){
  fillSelect(gradeSel, GRADES, '선택하세요');
  document.getElementById('totalCount').textContent = DATA.length;

    // no-op, just keeping structure obvious
  });
  updateGradeCounts();

  resetDown('month');

}

function resetDown(level){
  if(level === 'year'){
    fillSelect(yearSel, [], '학년을 먼저 선택하세요');
    yearSel.innerHTML = '<option value="">학년을 먼저 선택하세요</option>';
    yearSel.disabled = true;
  }
  if(level === 'month'){
    monthSel.innerHTML = '<option value="">연도를 먼저 선택하세요</option>';
    monthSel.disabled = true;
  }
}

function clearResult(){
  result.classList.remove('ready');
  resultMsg.textContent = '학년 / 연도 / 월을 모두 선택하면 여기에서 열 수 있어요.';
  renderDisabledButtons(['문제 PDF', '해설 PDF']);
  resetYoutubeField();
}

gradeSel.addEventListener('change', ()=>{
  const g = gradeSel.value;
  resetDown('month');
  clearResult();
  if(!g){ resetDown('year'); return; }
  const years = [...new Set(DATA.filter(d=>d.grade===g).map(d=>d.year))].sort((a,b)=>b-a);
  fillSelect(yearSel, years, '연도를 선택하세요');
});

yearSel.addEventListener('change', ()=>{
  const g = gradeSel.value, y = yearSel.value;
  clearResult();
  if(!y){ resetDown('month'); return; }
  const months = [...new Set(DATA.filter(d=>d.grade===g && String(d.year)===String(y)).map(d=>d.month))].sort();
  fillSelect(monthSel, months, '월을 선택하세요');
});

monthSel.addEventListener('change', ()=>{
  const g = gradeSel.value, y = yearSel.value, m = monthSel.value;
  if(!m){ clearResult(); return; }
  const entry = DATA.find(d=>d.grade===g && String(d.year)===String(y) && d.month===m);
  if(!entry){ clearResult(); return; }
  result.classList.add('ready');

  currentEntry = { grade: g, year: y, month: m };
  qNum.disabled = false;
  updateYoutubeLink();

  // track이 "gana"면 가형/나형 3버튼, 그 외(수능 포함)는 일반 문제/해설 2버튼
  const track = entry.track || null;
  const label = m === '수능' ? `${y}년 수능` : `${y}년 ${parseInt(m)}월`;
  resultMsg.textContent = `${g} · ${label}`;

  currentEntry = { grade: g, year: y, month: m, track };
  qNum.disabled = false;
  trackSel.style.display = track === 'gana' ? '' : 'none';
  updateYoutubeLink();

  if(track === 'gana'){
    renderButtons([
      { label: '가형 문제', href: pdfPath(g, y, m, '가형_문제'), primary: true },
      { label: '나형 문제', href: pdfPath(g, y, m, '나형_문제'), primary: true },
      { label: '가형 해설', href: pdfPath(g, y, m, '가형_해설'), primary: false },
      { label: '나형 해설', href: pdfPath(g, y, m, '나형_해설'), primary: false },
    ]);
  } else {
    renderButtons([
      { label: '문제 PDF', href: pdfPath(g, y, m, '문제'), primary: true },
      { label: '해설 PDF', href: pdfPath(g, y, m, '해설'), primary: false },
    ]);
  }
});

init();

/* ============================================================
   OCR + DB 매칭 — 문제 사진 자동 인식
   Tesseract.js로 텍스트 추출 → db.json과 매칭
   ============================================================ */
let selectedImageFile = null;
let examDB = null;  // db.json 로드 후 저장

// db.json 미리 로드
fetch('db.json')
  .then(r => r.json())
  .then(data => { examDB = data; })
  .catch(() => { examDB = null; });

function onImageSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  selectedImageFile = file;
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('scanPreview');
  preview.src = url;
  preview.style.display = 'block';
  document.getElementById('camArea').style.display = 'none';
  document.getElementById('scanBtn').disabled = false;
  document.getElementById('matchCard').classList.remove('show');
  setStatus('사진이 선택됐어요. "문제 인식하기"를 눌러주세요.');
}

function setStatus(msg, type=''){
  const el = document.getElementById('scanStatus');
  el.textContent = msg;
  el.className = 'scan-status' + (type ? ' ' + type : '');
}

// 텍스트 유사도 (간단한 단어 교집합 기반 Jaccard)
function similarity(a, b){
  const tokenize = s => new Set(
    s.replace(/[^가-힣a-zA-Z0-9]/g,' ')
     .split(/\s+/)
     .filter(w => w.length > 1)
  );
  const sa = tokenize(a), sb = tokenize(b);
  let inter = 0;
  sa.forEach(w => { if(sb.has(w)) inter++; });
  const union = new Set([...sa, ...sb]).size;
  return union === 0 ? 0 : inter / union;
}

// 시험 정보 직접 파싱 (우선순위 1)
function parseExamInfo(text){
  // 연도: 4자리 숫자
  const yearMatch = text.match(/(\d{4})/);
  const year = yearMatch ? parseInt(yearMatch[1]) : null;

  // 학년
  const gradeMatch = text.match(/고\s*([123])/);
  const grade = gradeMatch ? `고${gradeMatch[1]}` : null;

  // 월
  let month = null;
  if(/수능/.test(text)){
    month = '수능';
  } else {
    const monthMatch = text.match(/(\d{1,2})\s*월/);
    if(monthMatch) month = String(parseInt(monthMatch[1])).padStart(2,'0');
  }

  // 문제 번호
  const numMatch = text.match(/(?:^|\D)(\d{1,2})\s*[.\s]/m);
  const number = numMatch ? parseInt(numMatch[1]) : null;

  return { grade, year, month, number };
}

async function runScan(){
  if(!selectedImageFile){
    setStatus('사진을 먼저 선택해주세요.', 'err'); return;
  }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'OCR 처리 중...';
  setStatus('텍스트를 추출하고 있어요... (첫 실행은 10~20초 소요)');

  try {
    // Tesseract OCR (한국어 + 영어)
    const worker = await Tesseract.createWorker('kor+eng', 1, {
      logger: m => {
        if(m.status === 'recognizing text'){
          setStatus(`OCR 진행 중... ${Math.round(m.progress*100)}%`);
        }
      }
    });
    const { data: { text } } = await worker.recognize(selectedImageFile);
    await worker.terminate();

    if(!text.trim()){
      setStatus('텍스트를 추출하지 못했어요. 더 선명한 사진으로 시도해보세요.', 'err');
      btn.disabled = false; btn.textContent = '다시 인식'; return;
    }

    setStatus('DB와 매칭 중...');

    // ── 우선순위 1: 시험 정보 직접 파싱 ──
    const info = parseExamInfo(text);
    const directMatch = info.grade && info.year && info.month
      ? DATA.find(d =>
          d.grade === info.grade &&
          String(d.year) === String(info.year) &&
          d.month === info.month
        )
      : null;

    if(directMatch){
      await applyMatch(directMatch, info.number,
        `✓ ${info.grade} ${info.year}년 ${info.month === '수능' ? '수능' : parseInt(info.month)+'월'} 직접 인식 완료!`);
      btn.disabled = false; btn.textContent = '다시 인식'; return;
    }

    // ── 우선순위 2: DB 텍스트 유사도 매칭 ──
    if(!examDB){
      setStatus('db.json을 불러오지 못했어요. 직접 선택해주세요.', 'err');
      btn.disabled = false; btn.textContent = '다시 인식'; return;
    }

    // 문제 텍스트 중 상위 키워드만 추출 (길이 절약)
    const queryText = text.slice(0, 800);
    let scores = [];

    for(const entry of examDB){
      for(const prob of (entry.problems || [])){
        const s = similarity(queryText, prob.text);
        if(s > 0.05){
          scores.push({ entry, prob, score: s });
        }
      }
    }

    scores.sort((a,b) => b.score - a.score);
    const top = scores.slice(0, 3);

    if(top.length === 0){
      setStatus('유사한 문제를 찾지 못했어요. 더 선명한 사진으로 시도해보세요.', 'err');
      btn.disabled = false; btn.textContent = '다시 인식'; return;
    }

    // 결과 카드 표시
    showMatchCard(top);
    setStatus(`유사한 문제 ${top.length}개를 찾았어요. 아래에서 선택해주세요.`, 'ok');
    btn.disabled = false; btn.textContent = '다시 인식';

  } catch(err){
    setStatus('인식 실패: ' + err.message, 'err');
    btn.disabled = false; btn.textContent = '다시 인식';
  }
}

function showMatchCard(top){
  const card = document.getElementById('matchCard');
  card.innerHTML = '<b>유사 문제 후보</b>';
  top.forEach(({ entry, prob, score }) => {
    const monthLabel = entry.month === '수능' ? '수능' : parseInt(entry.month)+'월';
    const div = document.createElement('div');
    div.className = 'match-item';
    div.innerHTML = `
      <div class="mi-label">${entry.grade} · ${entry.year}년 ${monthLabel}${prob.number ? ' ' + prob.number + '번' : ''}</div>
      <div class="mi-score">유사도 ${Math.round(score*100)}%</div>
      <div class="mi-preview">${prob.text.slice(0,60).replace(/\n/g,' ')}...</div>
    `;
    div.onclick = () => applyMatch(entry, prob.number,
      `✓ ${entry.grade} ${entry.year}년 ${monthLabel}${prob.number ? ' ' + prob.number + '번' : ''} 선택됨`);
    card.appendChild(div);
  });
  card.classList.add('show');
}

async function applyMatch(entry, number, statusMsg){
  gradeSel.value = entry.grade;
  gradeSel.dispatchEvent(new Event('change'));
  await new Promise(r => setTimeout(r, 60));

  yearSel.value = String(entry.year);
  yearSel.dispatchEvent(new Event('change'));
  await new Promise(r => setTimeout(r, 60));

  monthSel.value = entry.month;
  monthSel.dispatchEvent(new Event('change'));

  if(number){
    qNum.value = number;
    qNum.dispatchEvent(new Event('input'));
  }
  setStatus(statusMsg, 'ok');
  document.getElementById('matchCard').classList.remove('show');
}

// 미리보기 탭 시 초기화
document.getElementById('scanPreview').addEventListener('click', ()=>{
  document.getElementById('scanPreview').style.display = 'none';
  document.getElementById('camArea').style.display = '';
  document.getElementById('imgInput').value = '';
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('scanBtn').textContent = '문제 인식하기';
  document.getElementById('matchCard').classList.remove('show');
  selectedImageFile = null;
  setStatus('');
});
</script>
